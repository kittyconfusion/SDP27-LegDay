[package]
edition = "2024"
name = "quadriceps"
rust-version = "1.95"
version = "0.1.0"
default-run = "quadriceps"

[[bin]]
name = "quadriceps"
path = "record.rs"

[features]
default = ["esp32s3"]
esp32s3 = [
    "esp-backtrace/esp32s3",
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-alloc/esp32s3",
    "esp-println/esp32s3",
    "esp-radio/esp32s3",
]
esp32c6 = [
    "esp-backtrace/esp32c6",
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-alloc/esp32c6",
    "esp-println/esp32c6",
    "esp-radio/esp32c6",
]
# psram stuff requires release optimizations (but want the possibility of debug for the rest of the build)
[profile.dev.package.esp-hal]
opt-level = 3

[dependencies]
legday-core = { path = "../legday-core" }

embassy-sync = { version = "0.8" }

embassy-embedded-hal = { version = "0.6" }

ht16k33-async = "0.0.2"

ringbuffer = "0.16.0"

esp-backtrace = { version = "0.20", features = ["panic-handler", "println", "colors"] }
esp-hal = { version = "~1.2.2", features = ["log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "log-04",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
log = "0.4.27"

embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "log",
    "medium-ethernet",
    "tcp",
    "udp",
] }
embedded-hal = "1.0.0"
embedded-hal-bus = {version = "0.3.0", features = ["async"]}
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-sdmmc = "0.10.0"
esp-alloc = { version = "0.11.0", features = [] }
esp-println = { version = "0.18.0", features = ["log-04"] }
bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "ble",
    "coex",
    "esp-alloc",
    "log-04",
    "unstable",
    "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
    "log",
    "medium-ethernet",
    "multicast",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
trouble-host = { version = "0.7.0", features = ["gatt"] }

heapless = "0.9.1"
static_cell = "2.1.1"
