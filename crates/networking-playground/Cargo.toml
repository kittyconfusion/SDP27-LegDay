[package]
name = "networking-playground"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["offline"]
offline = []
wifi = ["esp-radio/wifi", "dep:embassy-net"]
ble = ["esp-radio/ble", "dep:trouble-host", "dep:embassy-futures"]

[dependencies]
heapless = "0.9.1"

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "esp-alloc", "esp-radio"] }
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = ["esp32s3", "esp-alloc", "unstable"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-net = { version = "0.9.1", optional = true, default-features = false, features = ["dhcpv4", "medium-ethernet", "udp"] }
embassy-futures = { version = "0.1", optional = true }
trouble-host = { version = "0.7.0", optional = true, default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "default-packet-pool-size-8", "default-packet-pool-mtu-64", "l2cap-rx-queue-size-2", "l2cap-tx-queue-size-2"] }
static_cell = "2.1.1"

[[bin]]
name = "networking-playground"
path = "src/main.rs"
test = false
bench = false
