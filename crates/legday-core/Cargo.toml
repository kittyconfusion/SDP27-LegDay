[package]
name = "legday-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["esp32s3"]
esp32s3 = [
    "esp-hal/esp32s3",
]
esp32c6 = [
    "esp-hal/esp32c6",
]

[dependencies]

esp-hal = { version = "~1.2.2", features = ["log-04", "unstable"] }
embedded-sdmmc = "0.10.0"