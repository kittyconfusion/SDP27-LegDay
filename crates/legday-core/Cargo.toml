[package]
name = "legday-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sd-card-test"
path = "examples/sd-card-test.rs"
required-features = ["esp32s3"]

# The frame/clock/window library builds on a host without ESP dependencies.
# Enable this only for the legacy standalone SD-card diagnostic.
[features]
default = []
esp32s3 = [
    "dep:esp-backtrace", "esp-backtrace/esp32s3",
    "dep:esp-bootloader-esp-idf", "esp-bootloader-esp-idf/esp32s3",
    "dep:esp-hal", "esp-hal/esp32s3",
    "dep:esp-println", "esp-println/esp32s3",
    "dep:embedded-hal-bus", "dep:embedded-sdmmc",
    "dep:heapless", "dep:static_cell",
]

[dependencies]
esp-backtrace = { version = "0.20", optional = true, features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", optional = true, features = ["log-04"] }
esp-hal = { version = "~1.2.2", optional = true, features = ["log-04", "unstable"] }
esp-println = { version = "0.18.0", optional = true, features = ["log-04"] }
embedded-hal-bus = { version = "0.3.0", optional = true }
embedded-sdmmc = { version = "0.10.0", optional = true }
heapless = { version = "0.9.1", optional = true }
static_cell = { version = "2.1.1", optional = true }
