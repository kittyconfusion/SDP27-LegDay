[package]
edition = "2024"
name = "sdp27-leg-day"
rust-version = "1.95"
version = "0.1.0"
default-run = "sdp27-leg-day"

[[bin]]
name = "sdp27-leg-day"
path = "./src/bin/main.rs"

# To build for esp32c6
# cargo build --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf
# cargo run --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf

[features]
default = ["esp32s3"]
esp32s3 = ["esp-backtrace/esp32s3", "esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-alloc/esp32s3", "esp-println/esp32s3", "esp-radio/esp32s3"]
esp32c6 = ["esp-backtrace/esp32c6", "esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-alloc/esp32c6", "esp-println/esp32c6", "esp-radio/esp32c6"]


[dependencies]
esp-backtrace = { version = "0.20", features = ["panic-handler", "println"] }

esp-hal = { version = "~1.2.2", features = ["log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
log = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = [] }
esp-println = { version = "0.18.0", features = ["log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "coex",
  "esp-alloc",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
trouble-host = { version = "0.7.0", features = ["gatt"] }

critical-section = "1.2.0"
static_cell = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
