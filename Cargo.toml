[workspace]
resolver = "3"
members = [
    "crates/main_app",
    "crates/ulp_app",
    "crates/legday-core",
    "crates/legday-classifier",
    "crates/legday-icm20948"]
default-members = ["crates/main_app"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
