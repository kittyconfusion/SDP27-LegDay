# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
# Flashes with the QIO bootloader at 80 MHz (about 3x faster flash than
# espflash's defaults); see crates/scripts/bootloader/README.md.
runner = "crates/scripts/espflash-runner.sh"
rustflags = ["-C", "link-arg=-nostartfiles","-C", "link-arg=-Wl,--no-warn-rwx-segments"]

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --baud=921600 --monitor --chip esp32c6 --list-all-ports"
rustflags = ["-C", "force-frame-pointers"]

[unstable]
build-std = ["alloc", "core"]

[alias]
# run with "cargo run-c6" and "cargo build-c6
run-c6 = "run --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf"
build-c6 = "build --no-default-features --features esp32c6 --target riscv32imac-unknown-none-elf"
build-ulp = [
    "build", "--release", "--package", "hamstrings", "--features", "esp32s3", "--target", "riscv32imac-unknown-none-elf",
    "--config", "target.riscv32imac-unknown-none-elf.rustflags=['-C', 'link-arg=--entry=main']"
]